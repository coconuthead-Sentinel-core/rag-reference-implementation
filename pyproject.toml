[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reference"
version = "1.0.0"
description = "Retrieval-Augmented Generation reference implementation: pluggable embedding / vector / retrieval / reranker / generator with citation tracking."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shannon Brian Kelly" }]
keywords = ["rag", "retrieval-augmented-generation", "vector-search", "bm25", "hybrid-retrieval", "rrf", "citations"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["rag_reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
